<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eab308">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>HOMEKONG</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1f3e0;</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--card:#111111;--border:rgba(234,179,8,0.12);
  --gold:#eab308;--gold-dim:rgba(234,179,8,0.6);--gold-glow:rgba(234,179,8,0.15);
  --text:#e4e4e7;--text-muted:#71717a;--input-bg:#0d0d0d;--input-border:#27272a;
  --danger:#ef4444;--danger-bg:rgba(239,68,68,0.08);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

/* Dot grid background with radial fade */
.dot-grid{position:fixed;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(234,179,8,0.15) 1px,transparent 0);background-size:24px 24px;mask-image:radial-gradient(ellipse at center,rgba(0,0,0,0.6) 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at center,rgba(0,0,0,0.6) 0%,transparent 70%);pointer-events:none}

/* Ambient glow beams */
.glow-1,.glow-2{position:fixed;pointer-events:none;border-radius:50%;filter:blur(120px);opacity:0;animation:glowIn 2s ease-out forwards}
.glow-1{width:600px;height:400px;top:-100px;left:50%;margin-left:-400px;background:radial-gradient(ellipse,rgba(234,179,8,0.08),transparent 70%);animation-delay:.3s}
.glow-2{width:500px;height:350px;bottom:-50px;right:-100px;background:radial-gradient(ellipse,rgba(234,179,8,0.05),transparent 70%);animation-delay:.6s}
@keyframes glowIn{to{opacity:1}}

/* Card container */
.container{position:relative;width:100%;max-width:400px;padding:2rem;z-index:1}
.card{position:relative;background:rgba(17,17,17,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;box-shadow:2px 4px 16px 0px rgba(234,179,8,0.04) inset,0 0 0 1px rgba(234,179,8,0.05);overflow:hidden}

/* Border beam effect */
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--beam-angle,0deg),transparent 80%,var(--gold) 90%,var(--gold-dim) 95%,transparent 100%);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;animation:beamRotate 6s linear infinite;pointer-events:none}
@keyframes beamRotate{to{--beam-angle:360deg}}
@property --beam-angle{syntax:'<angle>';initial-value:0deg;inherits:false}

/* Logo */
.logo{text-align:center;margin-bottom:2rem;animation:fadeUp .8s ease-out both;animation-delay:.1s}
.logo h1{font-size:1.5rem;font-weight:700;letter-spacing:3px;color:var(--gold);background:linear-gradient(90deg,var(--gold),#fbbf24,var(--gold));background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 8s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:200% center}50%{background-position:-200% center}}
.logo .sub{font-size:.75rem;color:var(--text-muted);margin-top:.4rem;letter-spacing:.5px}

/* Form */
.form-group{margin-bottom:1.1rem;animation:fadeUp .8s ease-out both}
.form-group:nth-child(1){animation-delay:.2s}
.form-group:nth-child(2){animation-delay:.3s}
.form-group:nth-child(3){animation-delay:.4s}
.form-group label{display:block;font-size:.75rem;color:var(--text-muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.8px;font-weight:500}
.form-group input{width:100%;padding:.75rem 1rem;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;color:var(--text);font-size:.9rem;outline:none;transition:all .2s ease;box-shadow:0px 2px 3px -1px rgba(0,0,0,0.1),0px 1px 0px 0px rgba(25,28,33,0.02),0px 0px 0px 1px rgba(25,28,33,0.08)}
.form-group input:focus{border-color:rgba(234,179,8,0.4);box-shadow:0 0 0 2px rgba(234,179,8,0.12),0 0 20px rgba(234,179,8,0.05)}
.form-group input::placeholder{color:var(--text-muted)}

/* TOTP group */
#totp-card{animation:fadeUp .4s ease-out both}
.back-link{
  display:block;width:100%;margin-top:1rem;padding:0;background:none;border:none;
  color:var(--text-muted);font-size:.72rem;cursor:pointer;text-align:center;transition:color .2s;
}
.back-link:hover{color:var(--gold)}

/* Error */
.error{background:var(--danger-bg);border:1px solid rgba(239,68,68,0.3);color:var(--danger);padding:.7rem 1rem;border-radius:8px;font-size:.8rem;margin-bottom:1rem;text-align:center;display:none;animation:shake .4s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

/* Button with corner brackets */
.btn-wrap{position:relative;margin-top:1.5rem;animation:fadeUp .8s ease-out both;animation-delay:.5s}
.btn{width:100%;padding:.8rem;background:var(--gold);color:#0a0a0a;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s ease;position:relative}
.btn:hover{background:#fbbf24;transform:translateY(-1px);box-shadow:0 4px 20px rgba(234,179,8,0.3)}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
/* Corner brackets */
.corners{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
.btn-wrap:hover .corners{opacity:1}
.corners span{position:absolute;width:12px;height:12px;border-color:var(--gold);transition:all .25s ease}
.corners .tl{top:-4px;left:-4px;border-left:2px solid;border-top:2px solid;border-radius:4px 0 0 0}
.corners .tr{top:-4px;right:-4px;border-right:2px solid;border-top:2px solid;border-radius:0 4px 0 0}
.corners .bl{bottom:-4px;left:-4px;border-left:2px solid;border-bottom:2px solid;border-radius:0 0 0 4px}
.corners .br{bottom:-4px;right:-4px;border-right:2px solid;border-bottom:2px solid;border-radius:0 0 4px 0}
.btn-wrap:hover .tl{top:-8px;left:-8px}
.btn-wrap:hover .tr{top:-8px;right:-8px}
.btn-wrap:hover .bl{bottom:-8px;left:-8px}
.btn-wrap:hover .br{bottom:-8px;right:-8px}

/* Footer */
.footer{text-align:center;margin-top:1.5rem;font-size:.7rem;color:var(--text-muted);letter-spacing:.3px;animation:fadeUp .8s ease-out both;animation-delay:.6s}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style></head><body>
<div class="dot-grid"></div>
<div class="glow-1"></div>
<div class="glow-2"></div>
<div class="container">
<div class="card">
<div class="logo"><h1>HOMEKONG</h1><div class="sub">Management Console</div></div>
<div id="err" class="error"></div>
<form id="f" autocomplete="off">
<div class="form-group"><label>Username</label><input type="text" id="u" autocomplete="username" required spellcheck="false"></div>
<div class="form-group"><label>Password</label><input type="password" id="p" autocomplete="current-password" required></div>
<div class="btn-wrap">
<button type="submit" class="btn" id="btn">Sign In</button>
<div class="corners"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
</div>
</form>
<div class="footer">Secured Access</div>
</div>
<!-- 2FA Prompt (separate card) -->
<div class="card totp-card" id="totp-card" style="display:none">
<div class="logo"><h1>HOMEKONG</h1><div class="sub">Two-Factor Authentication</div></div>
<div id="err2" class="error"></div>
<form id="f2" autocomplete="off">
<div class="form-group"><label>Authentication Code</label><input type="text" id="t" maxlength="6" inputmode="numeric" placeholder="000000" autocomplete="one-time-code" required></div>
<div class="btn-wrap">
<button type="submit" class="btn" id="btn2">Verify</button>
<div class="corners"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
</div>
</form>
<button class="back-link" onclick="showLogin()">Back to login</button>
</div>
</div>
<script>
const f=document.getElementById('f'),btn=document.getElementById('btn'),eb=document.getElementById('err');
const f2=document.getElementById('f2'),btn2=document.getElementById('btn2'),eb2=document.getElementById('err2');
const loginCard=document.querySelector('.card:not(.totp-card)'),totpCard=document.getElementById('totp-card');
let pending=null;
f.onsubmit=async e=>{
  e.preventDefault();eb.style.display='none';btn.disabled=true;btn.textContent='...';
  try{
    const body={username:document.getElementById('u').value,password:document.getElementById('p').value};
    const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.ok){window.location.href='/s/'+d.session;return;}
    if(d.requires_2fa){pending=d.pending_id;showTotp();return;}
    err(d.error||'Authentication failed');
  }catch(x){err('Connection error');}
  btn.disabled=false;btn.textContent='Sign In';
};
f2.onsubmit=async e=>{
  e.preventDefault();eb2.style.display='none';btn2.disabled=true;btn2.textContent='...';
  try{
    const body={pending_id:pending,totp:document.getElementById('t').value};
    const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.ok){window.location.href='/s/'+d.session;return;}
    err2(d.error||'Invalid code');
  }catch(x){err2('Connection error');}
  btn2.disabled=false;btn2.textContent='Verify';
};
function showTotp(){loginCard.style.display='none';totpCard.style.display='block';document.getElementById('t').focus();}
function showLogin(){totpCard.style.display='none';loginCard.style.display='block';pending=null;btn.disabled=false;btn.textContent='Sign In';}
function err(m){eb.textContent=m;eb.style.display='block';}
function err2(m){eb2.textContent=m;eb2.style.display='block';}
</script>
</body></html>
