<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0C1838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/.hk/manifest.json">
<title>HOMEKONG - Server Panel</title>
<link rel="icon" type="image/png" href="/.hk/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:#0C1838;font-family:'Inter',sans-serif;color:#F5F0E6}
.container{position:relative;z-index:1;width:100%;max-width:420px;padding:32px 24px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center}
.logo-row{text-align:center;margin-bottom:20px}
.logo{width:72px;height:72px;border-radius:18%}
h1{font-family:'Cinzel',serif;font-size:1.4rem;letter-spacing:.12em;text-align:center;margin-bottom:6px}
.sub{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(194,163,90,.8);text-align:center;margin-bottom:32px}
.card{padding:28px 24px;background:rgba(255,255,255,.02);border-radius:8px;border:1px solid rgba(255,255,255,.06);margin-bottom:16px}
.field{margin-bottom:18px;text-align:left}
.field label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(245,240,230,.5);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(194,163,90,.2);border-radius:4px;color:#F5F0E6;font-size:.95rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.field input:focus{border-color:rgba(194,163,90,.5)}
.btn-login{width:100%;padding:14px;font-family:'Inter',sans-serif;font-weight:500;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#1a1306;background:#C2A35A;border:none;border-radius:4px;cursor:pointer;transition:background .2s}
.btn-login:hover{background:#a9883f}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.error{color:#e74c3c;font-size:.75rem;margin-top:10px;min-height:16px;text-align:center}
.status-bar{display:flex;gap:16px;justify-content:center;margin-bottom:20px;padding:10px 14px;background:rgba(255,255,255,.02);border-radius:4px;border:1px solid rgba(255,255,255,.05)}
.status-item{display:flex;align-items:center;gap:6px;font-size:.72rem;color:rgba(245,240,230,.7)}
.dot{width:8px;height:8px;border-radius:50%;background:#666;box-shadow:0 0 3px rgba(255,255,255,.2)}
.dot.online{background:#34d399}.dot.offline{background:#ef4444}
.player-count{opacity:.6;margin-left:4px;font-size:.72rem}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.ctrl-btn{padding:10px 8px;font-family:'Inter',sans-serif;font-weight:500;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;border:1px solid rgba(194,163,90,.3);cursor:pointer;transition:all .5s ease;text-decoration:none;text-align:center;display:block;color:#C2A35A;background:rgba(194,163,90,.08)}
.ctrl-btn:hover{background:rgba(194,163,90,.15);box-shadow:0 0 10px rgba(194,163,90,.35),0 0 20px rgba(194,163,90,.18);text-shadow:0 0 8px rgba(194,163,90,.5);transform:translateY(-1px);border-color:rgba(194,163,90,.6);}
.section-label{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,240,230,.3);margin-bottom:6px}
.greeting{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{background:rgba(194,163,90,.08);border:1px solid rgba(194,163,90,.3);border-radius:4px;padding:8px 16px;cursor:pointer;color:#C2A35A;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;transition:all .5s ease}
.icon-btn:hover{background:rgba(194,163,90,.15);box-shadow:0 0 10px rgba(194,163,90,.35),0 0 20px rgba(194,163,90,.18);text-shadow:0 0 8px rgba(194,163,90,.5);transform:translateY(-1px);border-color:rgba(194,163,90,.6);}
.ticker-wrap{overflow:hidden;margin-top:16px;padding:8px 0;border-top:1px solid rgba(194,163,90,.1);border-bottom:1px solid rgba(194,163,90,.1);position:relative;-webkit-mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%);opacity:0;transition:opacity 1.2s ease-in;}
.ticker-wrap.visible{opacity:1;}
.ticker{display:inline-block;white-space:nowrap;animation:ticker 45s linear infinite;font-size:.7rem;color:rgba(194,163,90,.85);letter-spacing:.03em;text-shadow:0 0 6px rgba(194,163,90,.4),0 0 12px rgba(194,163,90,.2);padding-left:100%;}
@keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
@media(max-width:600px){.ticker{font-size:.85rem;animation-duration:21s;}}
.footer{text-align:center;margin-top:24px;font-size:.6rem;letter-spacing:.1em;color:rgba(245,240,230,.2)}
.hidden{display:none}
@media(max-width:600px){
  body{padding:20px 16px;align-items:flex-start;padding-top:6vh}
  .container{max-width:100%;padding:0}
  .logo{width:80px;height:80px}
  h1{font-size:2rem}
  .sub{font-size:1rem;margin-bottom:28px}
  .card{padding:24px 20px}
  .field{margin-bottom:20px}
  .field label{font-size:.95rem}
  .field input{font-size:1.2rem;padding:16px 18px;border-radius:6px}
  .btn-login{font-size:1.1rem;padding:18px;border-radius:6px}
  .error{font-size:.9rem}
  .status-bar{flex-wrap:wrap;gap:14px;padding:14px;border-radius:6px}
  .status-item{font-size:1rem}
  .dot{width:12px;height:12px}
  .player-count{font-size:.9rem}
  .controls{grid-template-columns:1fr;gap:12px}
  .ctrl-btn{font-size:1rem;padding:16px 12px;border-radius:6px}
  .greeting{font-size:.9rem!important;max-width:100%}
  .section-label{font-size:.8rem}
  .icon-btn{font-size:.85rem;padding:10px 14px}
  .ticker-wrap{overflow:hidden;margin-top:16px;padding:8px 0;border-top:1px solid rgba(194,163,90,.1);border-bottom:1px solid rgba(194,163,90,.1);position:relative;-webkit-mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%);opacity:0;transition:opacity 1.2s ease-in;}
.ticker-wrap.visible{opacity:1;}
.ticker{display:inline-block;white-space:nowrap;animation:ticker 45s linear infinite;font-size:.7rem;color:rgba(194,163,90,.85);letter-spacing:.03em;text-shadow:0 0 6px rgba(194,163,90,.4),0 0 12px rgba(194,163,90,.2);padding-left:100%;}
@keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
@media(max-width:600px){.ticker{font-size:.85rem;animation-duration:21s;}}
.footer{font-size:.75rem;margin-top:32px}
}
canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.glow-orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:.12;animation:drift 20s infinite alternate ease-in-out;z-index:0;pointer-events:none;}
.glow-orb.a{width:700px;height:700px;background:#C2A35A;top:-200px;left:-150px;}
.glow-orb.b{width:600px;height:600px;background:#1a6fff;bottom:-200px;right:-150px;animation-delay:-7s;}
.glow-orb.c{width:500px;height:500px;background:#34d399;top:40%;left:55%;animation-delay:-13s;}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.1)}100%{transform:translate(-20px,20px) scale(.95)}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow-orb a"></div>
<div class="glow-orb b"></div>
<div class="glow-orb c"></div>
<div id="hk-header" style="display:none;position:fixed;top:0;left:0;right:0;z-index:100;padding:10px 14px;background:#0C1838;border-bottom:1px solid rgba(194,163,90,.15);align-items:center;gap:8px;flex-wrap:nowrap;">
  <img src="/.hk/logo.png" style="width:28px;height:28px;border-radius:12%;flex-shrink:0;">
  <span style="font-family:Cinzel,serif;font-size:.8rem;letter-spacing:.1em;flex:1;color:#F5F0E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">HOMEKONG</span>
  <a href="/.hk/settings" class="icon-btn" style="margin-left:auto;padding:5px 8px;font-size:.6rem;white-space:nowrap;flex-shrink:0;">⚙ Settings</a>
  <button class="icon-btn" style="border-color:rgba(231,76,60,.3);color:#e74c3c;background:rgba(231,76,60,.08);padding:5px 8px;font-size:.6rem;white-space:nowrap;flex-shrink:0;" onclick="doLogout()">Logout</button>
</div>
<div class="container" style="max-width:420px;width:100%;margin:0 auto;padding:32px 24px;">
  <div class="logo-row"><img src="/.hk/logo.png" alt="HOMEKONG" class="logo"></div>
  <h1>HOMEKONG</h1>
  <p class="sub">Server Management</p>

  <!-- LOGIN CARD -->
  <div class="card" id="loginCard">
    <form id="loginForm">
      <div class="field"><label>Username</label><input type="text" id="username" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
      <p class="error" id="error"></p>
    </form>
  </div>

  <!-- 2FA CARD -->
  <div class="card hidden" id="totpCard">
    <form id="totpForm">
      <div class="field"><label>2FA Code</label><input type="text" id="totpCode" autocomplete="one-time-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required></div>
      <button type="submit" class="btn-login" id="totpBtn">Verify</button>
      <p class="error" id="totpError"></p>
    </form>
  </div>

  <!-- CONTROL CARD (authed) -->
  <div class="hidden" id="controlCard">
    <div class="top-bar">
      <span class="greeting" id="greeting" style="font-size:.68rem;color:rgba(245,240,230,.6)"></span>
    </div>
    <div class="status-bar" onclick="window.open('https://status.homekong.cc','_blank')" style="cursor:pointer">
      <div class="status-item"><span class="dot" id="dotGame"></span>Game Server</div>
      <div class="status-item"><span class="dot" id="dotTx"></span>txAdmin</div>
      <div class="status-item"><span class="dot" id="dotDebug"></span>Debug</div>
      <div class="status-item" id="playerItem" style="display:none"><span style="opacity:.6">Players:</span> <span id="playerCount">0/32</span></div>
    </div>
    <div class="card">
      <p class="section-label">Controls</p>
      <div class="controls">
        <a href="/server/console" class="ctrl-btn">Admin Panel</a>
        <a href="/.hk/services" class="ctrl-btn">Services</a>
        <a href="https://media.homekong.cc" target="_blank" class="ctrl-btn">File Manager</a>
        <a href="https://image.homekong.cc" target="_blank" class="ctrl-btn">Image Host</a>
        <a href="https://debug.homekong.online" target="_blank" class="ctrl-btn">Join Debug FX</a>
        <a href="https://txdebug.homekong.cc" target="_blank" class="ctrl-btn">Debug TX Panel</a>
      </div>
    </div>
  </div>

  <div class="ticker-wrap" id="tickerWrap" style="display:none;"><div class="ticker" id="tickerContent"></div></div>
  <p class="footer" style="display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:24px auto 0;"><span style="opacity:.5">Est. 2022</span><span>&copy; HOMEKONG 2026</span></p>
</div>
<script>
// === Auth helpers ===
function getToken() {
  var m = document.cookie.match(/hk_token=([^;]+)/);
  return m ? m[1] : null;
}
function setToken(token, user) {
  document.cookie = 'hk_token=' + token + ';path=/;max-age=86400;SameSite=Lax';
  document.cookie = 'hk_tx=authenticated;path=/;max-age=86400;SameSite=Lax';
  document.cookie = 'hk_user=' + user + ';path=/;max-age=86400;SameSite=Lax';
}
function doLogout() {
  document.cookie = 'hk_token=;path=/;max-age=0';
  document.cookie = 'hk_tx=;path=/;max-age=0';
  document.cookie = 'hk_user=;path=/;max-age=0';
  window.location.reload();
}

// === Check existing session ===
var token = getToken();
var authed = !!token;
if (authed) {
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('controlCard').classList.remove('hidden');
  document.getElementById('hk-header').style.display = 'flex';
  document.body.style.paddingTop = '48px';
}

// === Login form ===
var pendingToken = null;
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  var u = document.getElementById('username').value;
  var p = document.getElementById('password').value;
  fetch('/.hk/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      if (d.ok && d.requires_2fa) {
        pendingToken = d.pending_token;
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('totpCard').classList.remove('hidden');
        document.getElementById('totpCode').focus();
      } else if (d.ok && d.token) {
        setToken(d.token, d.user);
        window.location.reload();
      } else {
        document.getElementById('error').textContent = d.error || 'Invalid credentials';
      }
    }).catch(function() { btn.disabled = false; document.getElementById('error').textContent = 'Connection error'; });
});

// === TOTP form ===
document.getElementById('totpForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = document.getElementById('totpBtn');
  btn.disabled = true;
  var code = document.getElementById('totpCode').value;
  fetch('/.hk/api/login/totp', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({pending_token: pendingToken, code: code}) })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      if (d.ok && d.token) {
        setToken(d.token, d.user);
        window.location.reload();
      } else {
        document.getElementById('totpError').textContent = d.error || 'Invalid code';
      }
    }).catch(function() { btn.disabled = false; document.getElementById('totpError').textContent = 'Connection error'; });
});

// === Status polling ===
function fetchStatus() {
  fetch('/.hk/api/status').then(function(r) {
    if (!r.ok) return null; return r.json();
  }).then(function(d) {
    if (!d) return;
    document.getElementById('dotGame').className = 'dot ' + (d.game ? 'online' : 'offline');
    document.getElementById('dotTx').className = 'dot ' + (d.txadmin ? 'online' : 'offline');
    document.getElementById('dotDebug').className = 'dot ' + (d.debug ? 'online' : 'offline');
    var pi = document.getElementById('playerItem');
    if (d.game) { pi.style.display = ''; document.getElementById('playerCount').textContent = d.players + '/32'; }
    else { pi.style.display = 'none'; }
  }).catch(function(){});
}

function getUser() { var m = document.cookie.match(/hk_user=([^;]+)/); return m ? m[1] : ''; }
function initGreeting() {
  var el = document.getElementById("greeting");
  var u = getUser();
  el.textContent = "Hello, " + u;
  var time = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  var ticker = document.getElementById("tickerContent");
  // ipapi.co supports HTTPS free tier
  Promise.all([
    fetch("https://ipapi.co/json/").then(function(r){return r.json();}),
    fetch("https://wttr.in/?format=j1").then(function(r){return r.json();})
  ]).then(function(results){
    var geo = results[0];
    var w = results[1];
    var loc = geo.city + ", " + geo.region + ", " + geo.country_name;
    var isp = geo.org || geo.asn;
    var ip = geo.ip;
    var temp = w.current_condition[0].temp_C;
    var desc = w.current_condition[0].weatherDesc[0].value;
    ticker.textContent = "🕐 " + time + "  ·  🌡 " + temp + "°C " + desc + "  ·  📍 " + loc + "  ·  🌐 " + isp + "  ·  🖥 " + ip;
    var tw=document.getElementById("tickerWrap");tw.style.display="block";setTimeout(function(){tw.classList.add("visible");},50);
  }).catch(function(){
    ticker.textContent = "🕐 " + time + "  ·  Welcome back!";
    var tw=document.getElementById("tickerWrap");tw.style.display="block";setTimeout(function(){tw.classList.add("visible");},50);
  });
  fetchStatus(); setInterval(fetchStatus, 5000);
}
if (authed) { initGreeting(); }

// Particles
(function(){var c=document.getElementById("bg"),ctx=c.getContext("2d");var particles=[];function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}window.addEventListener("resize",resize);resize();for(var i=0;i<60;i++){particles.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.5,a:Math.random()*.3+.1});}function draw(){ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<particles.length;i++){var p=particles[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(194,163,90,"+p.a+")";ctx.fill();}for(var i=0;i<particles.length;i++){for(var j=i+1;j<particles.length;j++){var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;var dist=Math.sqrt(dx*dx+dy*dy);if(dist<120){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle="rgba(194,163,90,"+(0.06*(1-dist/120))+")";ctx.stroke();}}}requestAnimationFrame(draw);}draw();})();
</script>
</body>
</html>
