limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

map $cookie_hk_token $hk_auth {
    "" 0;
    default 1;
}

# Main TX panel (tx.homekong.cc) -> hk-fxmain 192.168.50.235:40120
server {
    listen 80;
    server_name tx.homekong.cc;
    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /.hk/settings {
        if ($hk_auth = 0) { return 302 /; }
        alias /custom/settings.html;
        default_type text/html;
    }

    location ^~ /.hk/services {
        if ($hk_auth = 0) { return 302 /; }
        alias /custom/services.html;
        default_type text/html;
    }

    location ^~ /.hk/api/services/status {
        if ($hk_auth = 0) { return 403; }
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://tx-gate:3001/services/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /.hk/api/services {
        if ($hk_auth = 0) { return 403; }
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://tx-gate:3001/services;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /.hk/ { alias /custom/; }

    location ^~ /.hk/gate {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        alias /custom/login.html;
        default_type text/html;
    }

    location ^~ /.hk/api/status {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://tx-gate:3001/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /.hk/api/login/totp {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://tx-gate:3001/login/totp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /.hk/api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://tx-gate:3001/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /.hk/api/me {
        if ($hk_auth = 0) { return 401; }
        proxy_pass http://tx-gate:3001/api/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "Bearer $cookie_hk_token";
    }

    location ^~ /.hk/api/settings/ {
        if ($hk_auth = 0) { return 401; }
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://tx-gate:3001/api/settings/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "Bearer $cookie_hk_token";
    }

    location ^~ /.hk/api/admin/ {
        if ($hk_auth = 0) { return 401; }
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://tx-gate:3001/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "Bearer $cookie_hk_token";
    }

    location ^~ /.hk/api/logs {
        if ($hk_auth = 0) { return 403; }
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://tx-gate:3001/logs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /.hk/api/restart {
        if ($hk_auth = 0) { return 403; }
        limit_req zone=api burst=2 nodelay;
        proxy_pass http://tx-gate:3001/restart;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /.hk/api/ {
        if ($hk_auth = 0) { return 403; }
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://tx-gate:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        if ($hk_auth = 0) { rewrite ^ /.hk/gate last; }
        rewrite ^ /.hk/gate last;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?|ttf|map)$ {
        proxy_pass http://192.168.50.235:40120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /panel/socket.io/ {
        if ($hk_auth = 0) { return 403; }
        rewrite ^/panel/(.*) /$1 break;
        proxy_pass http://192.168.50.235:40120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /panel/ {
        if ($hk_auth = 0) { return 302 /; }
        rewrite ^/panel/(.*) /$1 break;
        proxy_pass http://192.168.50.235:40120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_buffering off;
        include /custom/topbar-snippet.conf;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /socket.io/ {
        if ($hk_auth = 0) { return 403; }
        proxy_pass http://192.168.50.235:40120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        if ($hk_auth = 0) { rewrite ^ /.hk/gate last; }
        proxy_pass http://192.168.50.235:40120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_buffering off;
        include /custom/topbar-snippet.conf;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

