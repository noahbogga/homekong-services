<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEKONG - Server Panel</title>
<link rel="icon" type="image/png" href="/custom/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0C1838;font-family:'Inter',sans-serif;color:#F5F0E6;}
.card{width:100%;max-width:400px;padding:48px 36px;text-align:center;}
.logo{width:80px;height:80px;border-radius:18%;margin:0 auto 20px;display:block;}
h1{font-family:'Cinzel',serif;font-size:1.5rem;letter-spacing:.12em;margin-bottom:6px;color:#F5F0E6;}
.sub{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(194,163,90,.8);margin-bottom:36px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:16px 40px;font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:#1a1306;background:linear-gradient(180deg,#E7D9A8,#C2A35A 55%,#A9883F);border:1px solid #8A6F33;border-radius:4px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 20px -6px rgba(194,163,90,.5);}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px -8px rgba(194,163,90,.7);}
.info{margin-top:24px;font-size:.75rem;color:rgba(245,240,230,.4);line-height:1.6;}
.footer{position:fixed;bottom:20px;font-size:.65rem;letter-spacing:.1em;color:rgba(245,240,230,.25);}
</style>
</head>
<body>
<div class="card">
  <img src="/custom/logo.png" alt="HOMEKONG" class="logo">
  <h1>HOMEKONG</h1>
  <p class="sub">Server Management</p>
  <a href="/panel/" class="btn">Enter Panel</a>
  <p class="info">Authorized staff only.<br>txAdmin server management console.</p>
</div>
<p class="footer">&copy; 2026 HOMEKONG</p>
</body>
</html>
