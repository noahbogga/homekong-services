# zx-db — isolated MariaDB for betting/casino/odds data (zx_wxyz_stream).
# Physically separate from the FiveM game DB on .235. Reachable by:
#   - the hk-odds-engine container (shared docker network zxnet)
#   - the game server .235 over the LAN (192.168.50.247:3306)
services:
  zx-mariadb:
    image: mariadb:11
    container_name: zx-mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${ZX_DB}
      - MARIADB_USER=${ZX_USER}
      - MARIADB_PASSWORD=${ZX_PASS}
    command:
      - --max-connect-errors=100000
      - --max-connections=200
      - --skip-name-resolve
    volumes:
      - zx-data:/var/lib/mysql
    ports:
      # LAN-reachable for the .235 game server; 3306 is free on .247.
      - "192.168.50.247:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  zx-data:

networks:
  default:
    name: zxnet
