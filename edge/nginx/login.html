<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEKONG - Image Host</title>
<link rel="icon" type="image/png" href="/custom/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0C1838;font-family:'Inter',sans-serif;color:#F5F0E6}
.container{width:100%;max-width:420px;padding:32px 24px}
.logo-row{text-align:center;margin-bottom:20px}
.logo{width:72px;height:72px;border-radius:18%}
h1{font-family:'Cinzel',serif;font-size:1.4rem;letter-spacing:.12em;text-align:center;margin-bottom:6px}
.sub{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(194,163,90,.8);text-align:center;margin-bottom:32px}
.card{padding:28px 24px;background:rgba(255,255,255,.02);border-radius:8px;border:1px solid rgba(255,255,255,.06)}
.field{margin-bottom:18px;text-align:left}
.field label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(245,240,230,.5);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(194,163,90,.2);border-radius:4px;color:#F5F0E6;font-size:.95rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.field input:focus{border-color:rgba(194,163,90,.5)}
.btn-login{width:100%;padding:14px;font-family:'Inter',sans-serif;font-weight:500;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#1a1306;background:#C2A35A;border:none;border-radius:4px;cursor:pointer;transition:background .2s}
.btn-login:hover{background:#a9883f}
.error{color:#e74c3c;font-size:.75rem;margin-top:10px;min-height:16px;text-align:center}
.footer{text-align:center;margin-top:24px;font-size:.6rem;letter-spacing:.1em;color:rgba(245,240,230,.2)}
</style>
</head>
<body>
<div class="container">
  <div class="logo-row"><img src="/custom/logo.png" alt="HOMEKONG" class="logo"></div>
  <h1>HOMEKONG</h1>
  <p class="sub">Image Host</p>
  <div class="card">
    <form id="loginForm">
      <div class="field"><label>Username</label><input type="text" id="username" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button type="submit" class="btn-login">Sign In</button>
      <p class="error" id="error"></p>
    </form>
  </div>
  <p class="footer">&copy; 2026 HOMEKONG</p>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  var u=document.getElementById("username").value,p=document.getElementById("password").value;
  fetch("/api/user/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.success){
        document.cookie="panel_access=1;path=/;max-age=86400;SameSite=Strict";
        document.cookie="picsur_token="+d.data.jwt_token+";path=/;max-age=604800;SameSite=Strict";
        localStorage.setItem("picsur-token",d.data.jwt_token);
        window.location.href="/";
      } else {
        document.getElementById("error").textContent="Invalid credentials";
      }
    }).catch(function(){document.getElementById("error").textContent="Connection error";});
});
</script>
</body>
</html>
