<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEKONG Media</title>
<link rel="icon" type="image/png" href="/custom/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0C1838;font-family:'Inter',sans-serif;color:#F5F0E6;}
.card{width:100%;max-width:380px;padding:48px 36px;text-align:center;}
.logo{width:72px;height:72px;border-radius:18%;margin:0 auto 20px;display:block;}
h1{font-family:'Cinzel',serif;font-size:1.4rem;letter-spacing:.12em;margin-bottom:6px;color:#F5F0E6;}
.sub{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(194,163,90,.8);margin-bottom:36px;}
.field{position:relative;margin-bottom:20px;text-align:left;}
.field label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(245,240,230,.5);margin-bottom:6px;}
.field input{width:100%;padding:12px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(194,163,90,.25);border-radius:4px;color:#F5F0E6;font-size:.95rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
.field input:focus{border-color:#C2A35A;}
.btn{width:100%;padding:14px;margin-top:8px;font-family:'Cinzel',serif;font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:#1a1306;background:linear-gradient(180deg,#E7D9A8,#C2A35A 55%,#A9883F);border:1px solid #8A6F33;border-radius:4px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 20px -6px rgba(194,163,90,.5);}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px -8px rgba(194,163,90,.7);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.error{color:#e74c3c;font-size:.8rem;margin-top:12px;min-height:20px;}
.footer{margin-top:32px;font-size:.65rem;letter-spacing:.1em;color:rgba(245,240,230,.3);}
</style>
</head>
<body>
<div class="card">
  <img src="/custom/logo.png" alt="HOMEKONG" class="logo">
  <h1>HOMEKONG</h1>
  <p class="sub">Media Portal</p>
  <form id="loginForm">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign In</button>
    <p class="error" id="error"></p>
  </form>
  <p class="footer">&copy; 2025 HOMEKONG</p>
</div>
<script>
(function(){
  var form = document.getElementById('loginForm');
  var errorEl = document.getElementById('error');
  var btn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    e.stopPropagation();
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = '...';

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    if (!username || !password) {
      errorEl.textContent = 'Enter username and password';
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/login', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 10000;

    xhr.onload = function() {
      if (xhr.status === 200) {
        var token = xhr.responseText.trim();
        document.cookie = 'auth=' + token + ';path=/;max-age=86400;SameSite=Lax';
        localStorage.setItem('jwt', token);
        window.location.replace('/files/');
      } else {
        errorEl.textContent = 'Invalid credentials';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    };

    xhr.onerror = function() {
      errorEl.textContent = 'Connection error';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    };

    xhr.ontimeout = function() {
      errorEl.textContent = 'Request timed out';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    };

    xhr.send(JSON.stringify({username: username, password: password}));
  });
})();
</script>
</body>
</html>
