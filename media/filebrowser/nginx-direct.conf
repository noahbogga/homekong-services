server {
    listen 80;
    server_name direct.homekong.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name direct.homekong.cc;
    client_max_body_size 0;

    ssl_certificate /etc/letsencrypt/live/direct.homekong.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/direct.homekong.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # CORS headers for cross-origin upload/download from media.homekong.cc
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Auth, X-Requested-With" always;
    add_header Access-Control-Expose-Headers "Content-Disposition" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        # Pass auth query param as X-Auth header for filebrowser
        set $auth_token "";
        if ($arg_auth != "") {
            set $auth_token $arg_auth;
        }

        proxy_pass http://filebrowser-direct:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Auth $auth_token;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
