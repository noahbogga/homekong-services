server {
    listen 80;
    client_max_body_size 512M;

    location = /login {
        default_type text/html;
        alias /custom/login.html;
    }

    location /custom/ {
        add_header Cache-Control "no-cache, must-revalidate";
        alias /custom/;
    }

    location /p/ {
        proxy_pass http://share-service:3000;
        proxy_set_header Host $host;
    }

    location = /create {
        proxy_pass http://share-service:3000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://filebrowser-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 /login;
    }

    location / {
        proxy_pass http://filebrowser-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering off;

        sub_filter '</body>' '<script src="/custom/js/custom.js?v=20"></script></body>';
        sub_filter 'File Browser' 'HOMEKONG Media';
        sub_filter_types text/html;
        sub_filter_once off;
    }
}
