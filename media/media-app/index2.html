<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0C1838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>HOMEKONG - File Manager</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        hk: { bg: '#0a0e1a', light: 'rgba(15,20,35,0.8)', card: 'rgba(255,255,255,0.03)' },
        gold: { DEFAULT: '#C2A35A', dim: 'rgba(194,163,90,0.4)', glow: 'rgba(194,163,90,0.1)' },
        cream: { DEFAULT: '#e8edf5', dim: 'rgba(232,237,245,0.5)' },
        danger: '#ef4444',
        success: '#22c55e',
        info: '#60a5fa',
        warn: '#f59e0b',
      },
      fontFamily: {
        sans: ['Inter', 'sans-serif'],
        head: ['Inter', 'sans-serif'],
      },
    }
  }
}
</script>
<style>
/* Glass/Acrylic theme */
body { background: #0a0e1a; }
::-webkit-scrollbar { width: 6px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
#sidebar-tree::-webkit-scrollbar { width: 4px; }
#sidebar-tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
#monaco-container { width: 100%; height: 100%; }
select { background-color: rgba(15,20,35,0.9) !important; color: #e8edf5 !important; }
select option { background: #0f1423; color: #e8edf5; }
@keyframes fadeIn { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
#toast.show { animation: fadeIn .2s; }
/* Sidebar particle canvas */
#sidebar-bg { position:absolute; inset:0; pointer-events:none; z-index:0; }
/* Tree drag-over glow */
.tree-drag-over { outline: 2px dashed #60a5fa; outline-offset: -2px; background: rgba(96,165,250,0.08); box-shadow: 0 0 10px rgba(96,165,250,0.15); }
/* File item drag-over glow */
.item-drag-over { outline: 2px dashed #60a5fa; background: rgba(96,165,250,0.08) !important; box-shadow: 0 0 12px rgba(96,165,250,0.15); }
.touch-hover { outline: 2px dashed #60a5fa; background: rgba(96,165,250,0.08) !important; box-shadow: 0 0 12px rgba(96,165,250,0.15); }
/* Sidebar tree expand animation */
@keyframes tree-expand {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.tree-expand-anim { animation: tree-expand 0.2s ease-out; }
/* Breadcrumb shimmer animation */
@keyframes breadcrumb-shimmer {
  0% { opacity:0; background-position: -100% 0; }
  15% { opacity:1; }
  50% { opacity:0.7; background-position: 0% 0; }
  65% { opacity:1; }
  100% { opacity:0; background-position: 100% 0; }
}
#breadcrumb-bar.shimmer::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, transparent 0%, rgba(96,165,250,0.06) 30%, rgba(96,165,250,0.12) 50%, rgba(96,165,250,0.06) 70%, transparent 100%);
  background: linear-gradient(90deg, transparent 0%, rgba(194,163,90,0.12) 30%, rgba(194,163,90,0.25) 50%, rgba(194,163,90,0.12) 70%, transparent 100%);
  background-size: 100% 100%;
  animation: breadcrumb-shimmer 0.6s ease-in-out forwards;
  border-radius: inherit;
}
/* Block Android long-press context menu */
.file-item { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
/* Status bar light animations */
@keyframes status-blink-fast { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
@keyframes status-blink-slow { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
#status-light.blink-fast { animation: status-blink-fast 0.4s ease-in-out infinite; }
#status-light.blink-slow { animation: status-blink-fast 1s ease-in-out infinite; }
#status-light.pulse { animation: status-blink-slow 2s ease-in-out infinite; }
/* Header horizontal scroll hide */
#header::-webkit-scrollbar { display: none; }
#header { scrollbar-width: none; }
/* Action bar scroll hide */
.actions-scroll::-webkit-scrollbar { display: none; }
.actions-scroll { scrollbar-width: none; }
/* Toolbar scroll hide */
#toolbar::-webkit-scrollbar { display: none; }
#toolbar { scrollbar-width: none; }
#lasso-rect {
  position: fixed;
  border: 1px solid rgba(194,163,90,0.7);
  background: rgba(194,163,90,0.08);
  pointer-events: none;
  z-index: 9000;
}
body.lasso-active, body.lasso-active * {
  user-select: none !important;
  -webkit-user-select: none !important;
  cursor: crosshair !important;
}
  display: none;
}
</style>
</head>
<body class="text-cream font-sans min-h-screen overflow-x-hidden">
<!-- LOGIN -->
<div id="login-view" class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-[360px] px-8 py-10 text-center bg-[rgba(15,20,35,0.6)] backdrop-blur-xl rounded-2xl border border-white/[.06]">
    <img src="/assets/logo.png" alt="HOMEKONG" class="w-16 h-16 rounded-[18%] mx-auto mb-4">
    <h1 class="font-head text-xl tracking-[.12em] mb-1">HOMEKONG</h1>
    <p class="text-[.7rem] tracking-[.2em] uppercase text-gold/80 mb-8">Media Portal</p>
    <form id="loginForm">
      <div class="mb-4 text-left">
        <label class="block text-[.65rem] tracking-[.12em] uppercase text-cream-dim mb-1">Username</label>
        <input type="text" id="login-user" autocomplete="username" required class="w-full px-3 py-2.5 bg-white/[.06] border border-gold/25 rounded text-cream text-sm font-sans outline-none focus:border-gold/60 transition">
      </div>
      <div class="mb-4 text-left">
        <label class="block text-[.65rem] tracking-[.12em] uppercase text-cream-dim mb-1">Password</label>
        <input type="password" id="login-pass" autocomplete="current-password" required class="w-full px-3 py-2.5 bg-white/[.06] border border-gold/25 rounded text-cream text-sm font-sans outline-none focus:border-gold/60 transition">
      </div>
      <button type="submit" class="w-full py-2.5 bg-gold text-[#1a1306] rounded font-semibold text-sm font-head tracking-[.12em] hover:bg-[#d4b56a] transition">SIGN IN</button>
      <p id="login-error" class="text-danger text-xs mt-2 min-h-[16px]"></p>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app-view" class="hidden flex-col h-[100dvh]">
  <!-- HEADER -->
  <div id="header" class="flex items-center gap-2 sm:gap-4 px-3 sm:px-6 py-2 sm:py-3 bg-[rgba(10,14,26,0.85)] backdrop-blur-lg border-b border-white/[.06] sticky top-0 z-[100] overflow-x-auto">
    <img src="/assets/logo.png" alt="HK" class="w-7 h-7 sm:w-10 sm:h-10 rounded-[12%] flex-shrink-0">
    <h1 class="hidden sm:block font-sans text-sm sm:text-base tracking-[.05em] font-medium flex-1 whitespace-nowrap text-white/80">File Manager</h1>
    <div class="flex items-center gap-1.5 sm:gap-2 ml-auto flex-shrink-0">
      <button id="discard-btn" onclick="discardAll()" class="hidden px-2 sm:px-3 py-1.5 sm:py-2 text-[.6rem] sm:text-[.65rem] rounded-lg border border-red-400/20 text-red-400 bg-white/[.03] backdrop-blur-sm hover:bg-red-400/10 transition-all whitespace-nowrap">✕ Discard (0)</button>
      <a id="panel-btn" href="https://tx.homekong.cc" class="header-btn px-2 sm:px-3 py-1.5 sm:py-2 text-[.6rem] sm:text-[.65rem] rounded-lg border border-white/[.08] text-white/60 bg-white/[.03] backdrop-blur-sm hover:bg-white/[.07] hover:text-white/90 transition-all whitespace-nowrap">Panel</a>
      <button onclick="openResolver()" class="header-btn px-2 sm:px-3 py-1.5 sm:py-2 text-[.6rem] sm:text-[.65rem] rounded-lg border border-yellow-400/15 text-yellow-400/70 bg-white/[.02] backdrop-blur-sm hover:bg-yellow-400/10 hover:text-yellow-400 transition-all whitespace-nowrap">⚡ Resolve</button>
      <button onclick="logout()" class="header-btn px-2 sm:px-3 py-1.5 sm:py-2 text-[.6rem] sm:text-[.65rem] rounded-lg border border-red-400/15 text-red-400/70 bg-white/[.02] backdrop-blur-sm hover:bg-red-400/10 hover:text-red-400 transition-all whitespace-nowrap">Sign Out</button>
    </div>
  </div>

  <!-- Breadcrumb bar (ALWAYS visible) -->
  <div id="breadcrumb-bar" class="flex items-center px-3 sm:px-4 py-1.5 gap-2 border-b border-white/[.04] bg-[rgba(12,16,28,0.7)] backdrop-blur-md sticky top-[44px] sm:top-[52px] z-[95] flex-shrink-0 relative overflow-hidden">
    <button id="sidebar-toggle-btn" onclick="toggleSidebar()" class="bg-white/[.03] border border-white/[.08] text-white/50 px-2 py-1 rounded-lg text-xs cursor-pointer hover:bg-white/[.07] hover:text-white/80 flex-shrink-0 transition backdrop-blur-sm">☰</button>
    <div id="breadcrumb-inline" class="text-[.72rem] text-white/50 flex items-center gap-1 flex-wrap flex-1 overflow-hidden"></div>
    <div class="flex items-center gap-1 flex-shrink-0">
      <button onclick="openUploadModal()" class="px-2 py-1 text-[.6rem] rounded-lg border border-emerald-400/15 text-emerald-400/70 bg-white/[.02] backdrop-blur-sm hover:bg-emerald-400/10 hover:text-emerald-400 transition whitespace-nowrap">⬆ Upload</button>
      <button onclick="openCreateNewModal()" id="new-btn" class="px-2 py-1 text-[.6rem] rounded-lg border border-blue-400/15 text-blue-400/70 bg-white/[.02] backdrop-blur-sm hover:bg-blue-400/10 hover:text-blue-400 transition whitespace-nowrap">+ New</button>
      <button id="view-toggle" onclick="toggleView()" class="px-2 py-1 text-[.6rem] rounded-lg border border-white/[.08] text-white/50 bg-white/[.02] backdrop-blur-sm hover:bg-white/[.07] hover:text-white/80 transition whitespace-nowrap">⊞</button>
      <button onclick="openSearch()" class="px-2 py-1 text-[.6rem] rounded-lg border border-white/[.08] text-white/50 bg-white/[.02] backdrop-blur-sm hover:bg-white/[.07] hover:text-white/80 transition whitespace-nowrap">🔍</button>
    </div>
  </div>

  <!-- LAYOUT -->
  <div id="app-layout" class="flex flex-1 overflow-hidden relative">
    <!-- Sidebar backdrop (mobile only) -->
    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/50 z-[85] md:hidden" onclick="toggleSidebar()"></div>
    <!-- Sidebar: fixed on mobile, relative on desktop (pushes content) -->
    <div id="sidebar" class="bg-[rgba(12,16,28,0.6)] backdrop-blur-lg border-r border-white/[.05] flex-shrink-0 flex flex-col overflow-hidden z-[90] transition-all duration-300 ease-in-out">
      <canvas id="sidebar-bg"></canvas>
      <div id="sidebar-tree" class="flex-1 overflow-y-auto py-1.5 relative z-[1] flex flex-col"></div>
    </div>

    <!-- Main area -->
    <div id="main-area" class="flex-1 flex flex-col overflow-hidden min-w-0">
      <div id="file-list" class="flex-1 overflow-y-auto px-3 sm:px-5 py-2 pb-14 sm:pb-20"></div>
    </div>
  </div>

  <!-- Status Bar (full width, below sidebar+content) -->
  <div id="status-bar" class="flex items-center px-2 sm:px-3 py-0.5 sm:py-1 bg-[rgba(8,12,22,0.9)] backdrop-blur-md border-t border-white/[.04] text-[.55rem] sm:text-[.65rem] gap-1.5 sm:gap-2 flex-shrink-0 z-[100] select-none">
        <div class="flex items-center gap-1.5 flex-1 min-w-0 cursor-pointer" onclick="treeCache={};navigate(currentPath);" title="Click to refresh">
          <span id="status-light" class="w-2 h-2 rounded-full bg-success flex-shrink-0"></span>
          <span id="status-msg" class="text-cream-dim truncate">Ready</span>
          <button id="status-dismiss" onclick="dismissStatus()" class="hidden px-1.5 py-0.5 text-[.55rem] rounded border border-cream-dim/30 text-cream-dim hover:bg-white/10 transition flex-shrink-0">✕</button>
          <button id="status-report" onclick="reportStatus()" class="hidden px-1.5 py-0.5 text-[.55rem] rounded border border-danger/40 text-danger hover:bg-danger/10 transition flex-shrink-0">Report</button>
        </div>
        <div class="flex items-center gap-2 sm:gap-3 text-cream-dim flex-shrink-0">
          <span id="status-ip" class="hidden sm:inline"></span>
          <span id="status-clock"></span>
        </div>
      </div>
</div>

  <!-- Fixed bottom toolbar (grid multi-select) -->
  <div id="toolbar" class="fixed bottom-0 left-0 right-0 md:left-[10%] md:right-[10%] md:bottom-5 md:w-[80%] md:mx-auto hidden bg-[rgba(15,20,35,0.9)] backdrop-blur-xl border border-white/[.08] md:rounded-xl px-2 py-1.5 md:px-3 md:py-2 gap-1.5 z-[200] shadow-[0_8px_32px_rgba(0,0,0,.5)] overflow-x-auto whitespace-nowrap">
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-success text-success bg-success/[.15] hover:bg-success/25 transition flex-shrink-0" onclick="downloadSelected()">⬇ Download</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-gold text-gold bg-gold/[.15] hover:bg-gold/25 transition flex-shrink-0" onclick="shareSelected()">🔗 Share</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-white/30 text-cream bg-white/10 hover:bg-white/[.18] transition flex-shrink-0" onclick="renameSelected()">✏ Rename</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-emerald-400 text-emerald-400 bg-emerald-400/[.15] hover:bg-emerald-400/25 transition flex-shrink-0" id="tb-paste" onclick="confirmPaste()" style="display:none">📋 Paste</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-cyan-400 text-cyan-400 bg-cyan-400/[.15] hover:bg-cyan-400/25 transition flex-shrink-0" onclick="copySelected()">⧉ Copy</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-amber-400 text-amber-400 bg-amber-400/[.15] hover:bg-amber-400/25 transition flex-shrink-0" onclick="cutSelected()">✂ Cut</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-yellow-400 text-yellow-400 bg-yellow-400/[.15] hover:bg-yellow-400/25 transition flex-shrink-0" onclick="moveSelected()">↪ Move</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-danger text-danger bg-danger/[.12] hover:bg-danger/[.22] transition flex-shrink-0" onclick="deleteSelected()">Delete</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-purple-400 text-purple-400 bg-purple-400/[.12] hover:bg-purple-400/[.22] transition flex-shrink-0" id="tb-undo" onclick="undoLast()" style="display:none">↩ Undo</button>
    <button class="act-btn inline-flex items-center gap-1 px-2 py-1.5 rounded text-[.65rem] font-semibold border border-purple-400 text-purple-400 bg-purple-400/[.12] hover:bg-purple-400/[.22] transition flex-shrink-0" id="tb-redo" onclick="redoLast()" style="display:none">↪ Redo</button>
    <button class="act-btn inline-flex items-center gap-1 px-1.5 py-1.5 rounded text-[.65rem] font-semibold border border-info text-info bg-info/[.15] hover:bg-info/25 transition flex-shrink-0" onclick="infoSelected()">ℹ</button>
    <button class="act-btn md:hidden inline-flex items-center gap-1 px-1.5 py-1.5 rounded text-[.65rem] font-semibold border border-white/20 text-white/60 bg-white/[.04] hover:bg-white/[.08] transition flex-shrink-0" onclick="_showContextMenuFromToolbar()">⋮</button>
  </div>
</div>


<!-- MODALS -->
<!-- Upload Modal -->
<div class="modal-overlay fixed inset-0 bg-black/70 z-[9999] hidden items-center justify-center" id="upload-modal">
  <div class="bg-[rgba(15,20,35,0.75)] backdrop-blur-xl border border-white/[.08] rounded-xl p-6 w-[90%] max-w-[440px] max-h-[80vh] overflow-y-auto relative">
    <h2 class="font-sans font-medium text-sm text-white/80 mb-3">Upload Files</h2>
    <button class="modal-close absolute top-2.5 right-3.5 bg-transparent border-none text-cream-dim text-xl cursor-pointer" onclick="closeUpload()">&times;</button>
    <div class="mb-3">
      <label class="block text-[.6rem] uppercase tracking-wider text-white/40 mb-1">Upload to</label>
      <div class="flex items-center gap-1">
        <div id="upload-location" class="flex-1 px-3 py-2 bg-white/[.04] border border-white/[.08] rounded-lg text-white/90 text-xs font-sans overflow-hidden text-ellipsis whitespace-nowrap"></div>
        <button onclick="changeUploadLocation()" class="px-2 py-2 bg-white/[.06] border border-white/[.1] rounded-lg text-[.6rem] text-white/80 hover:bg-white/[.1] transition" title="Change location">📂</button>
      </div>
    </div>
    <div id="upload-zone" class="border-2 border-dashed border-white/[.12] rounded-xl py-6 px-4 text-center cursor-pointer transition-all hover:border-white/[.25] hover:bg-white/[.04] mb-3">
      <div class="text-3xl"><img src="/assets/folder.png" class="w-10 h-10 mx-auto"></div>
      <p class="text-white/40 text-xs mt-1.5">Click to select files · Right-click for folders · Or drag here</p>
    </div>
    <div id="upload-file-list" class="max-h-[160px] overflow-y-auto mb-2.5"></div>
    <button class="w-full py-2.5 bg-white/[.06] border border-white/[.1] text-white/80 rounded-lg font-semibold text-sm cursor-pointer hover:bg-white/[.1] disabled:opacity-50 disabled:cursor-not-allowed transition" id="upload-go" onclick="startUpload()" disabled>Upload</button>
    <input type="file" id="file-input" multiple hidden>
    <input type="file" id="folder-input" webkitdirectory hidden>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay fixed inset-0 bg-black/70 z-[9999] hidden items-center justify-center" id="delete-modal">
  <div class="bg-[rgba(15,20,35,0.75)] backdrop-blur-xl border border-white/[.08] rounded-xl p-6 w-[90%] max-w-[440px] relative">
    <h2 class="font-sans font-medium text-sm text-white/80 mb-3">Confirm Delete</h2>
    <button class="modal-close absolute top-2.5 right-3.5 bg-transparent border-none text-cream-dim text-xl cursor-pointer" onclick="closeDelete()">&times;</button>
    <div class="text-red-400 text-xs mb-2.5 p-2 bg-red-400/10 border border-red-400/20 rounded-lg whitespace-pre-line" id="delete-warning"></div>
    <button class="w-full py-2.5 bg-red-400/10 border border-red-400/20 text-red-400 rounded-lg font-semibold cursor-pointer hover:bg-red-400/20 transition" id="delete-confirm" onclick="confirmDelete()">Delete Permanently</button>
    <button class="w-full py-2.5 mt-2 bg-white/[.03] border border-white/[.06] text-white/40 rounded-lg font-semibold cursor-pointer hover:bg-white/[.06] transition" onclick="closeDelete()">Cancel</button>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay fixed inset-0 bg-black/70 z-[9999] hidden items-center justify-center" id="rename-modal">
  <div class="bg-[rgba(15,20,35,0.75)] backdrop-blur-xl border border-white/[.08] rounded-xl p-6 w-[90%] max-w-[440px] relative">
    <h2 class="font-sans font-medium text-sm text-white/80 mb-3">Rename</h2>
    <button class="modal-close absolute top-2.5 right-3.5 bg-transparent border-none text-cream-dim text-xl cursor-pointer" onclick="closeRename()">&times;</button>
    <div id="rename-list" class="mb-3"></div>
    <button class="w-full py-2.5 bg-white/[.06] border border-white/[.1] text-white/80 rounded-lg font-semibold cursor-pointer hover:bg-white/[.1] transition" onclick="confirmRename()">Rename</button>
  </div>
</div>

<!-- Move Modal -->
<div class="modal-overlay fixed inset-0 bg-black/70 z-[9999] hidden items-center justify-center" id="move-modal">
  <div class="bg-[rgba(15,20,35,0.75)] backdrop-blur-xl border border-white/[.08] rounded-xl p-6 w-[90%] max-w-[440px] relative">
    <h2 class="font-sans font-medium text-sm text-white/80 mb-3">Move To</h2>
    <button class="modal-close absolute top-2.5 right-3.5 bg-transparent border-none text-cream-dim text-xl cursor-pointer" onclick="closeMove()">&times;</button>
    <div id="move-breadcrumb" class="text-[.7rem] text-white/40 mb-2.5"></div>
    <div id="move-folder-list" class="max-h-[220px] overflow-y-auto mb-2.5"></div>
    <button class="w-full py-2.5 bg-white/[.06] border border-white/[.1] text-white/80 rounded-lg font-semibold cursor-pointer hover:bg-white/[.1] transition" onclick="confirmMove()">Move Here</button>
  </div>
</div>

<!-- Move Confirm Modal -->
<div class="modal-overlay fixed inset-0 bg-black/70 z-[9999] hidden items-center justify-center" id="move-confirm-modal">
  <div class="bg-[rgba(15,20,35,0.75)] backdrop-blur-xl border border-white/[.08] rounded-xl p-6 w-[90%] max-w-[440px] relative">
    <h2 class="font-sans font-medium text-sm text-white/80 mb-3">Confirm Move</h2>
    <button class="modal-close absolute top-2.5 right-3.5 bg-transparent border-none text-cream-dim text-xl cursor-pointer" onclick="closeDragConfirm()">&times;</button>
    <div class="text-xs p-2.5 bg-white/[.04] border border-white/[.08] rounded-lg mb-3 text-white/70" id="move-confirm-detail"></div>
    <button class="w-full py-2.5 bg-white/[.06] border border-white/[.1] text-white/80 rounded-lg font-semibold cursor-pointer hover:bg-white/[.1] transition" id="move-confirm-exec-btn" onclick="executeMoveConfirm()">Move</button>
    <button class="w-full py-2.5 mt-2 bg-white/[.03] border border-white/[.06] text-white/40 rounded-lg font-semibold cursor-pointer hover:bg-white/[.06] transition" id="move-confirm-cancel-btn" onclick="closeDragConfirm()">Cancel</button>
  </div>
</div>

<!-- Info Modal -->
