server {
    listen 80;
    client_max_body_size 50G;

    # Serve our custom SPA
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        root /app;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Filebrowser API proxy
    location /api/ {
        set $auth_header $http_x_auth;
        if ($arg_auth) {
            set $auth_header $arg_auth;
        }
        proxy_set_header X-Auth $auth_header;
        proxy_pass http://filebrowser-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Share service
    location = /create {
        proxy_pass http://share-service:3000;
        proxy_set_header Host $host;
    }

    # Search service (file index + proxy to aether)
    location /search-api/ {
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_pass http://search-service:3002/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }


    # Browser service (headless)
    location ^~ /browser-api/ {
        proxy_pass http://browser-service:3004/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Resolver service
    location ^~ /resolver-api/ {
        proxy_pass http://resolver-service:3003/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 50M;
    }

    # Direct upload for whitelisted users (bypasses Cloudflare, hits LAN IP directly)
    location ^~ /upload-api/direct {
        set $auth_header $http_x_auth;
        if ($arg_auth) {
            set $auth_header $arg_auth;
        }
        proxy_set_header X-Auth $auth_header;
        proxy_pass http://upload-service:3007/direct;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50G;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # CFG file editor bypass (for filebrowser 403 issue)
    location ^~ /cfg-api/ {
        proxy_pass http://cfg-editor:3009/;
        proxy_set_header Host $host;
        proxy_set_header X-Auth $http_x_auth;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Chunked upload service (large files past Cloudflare's 200MB body cap)
    location ^~ /upload-api/ {
        set $auth_header $http_x_auth;
        if ($arg_auth) {
            set $auth_header $arg_auth;
        }
        proxy_set_header X-Auth $auth_header;
        proxy_pass http://upload-service:3007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200M;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Static CDN for sky-assets (permanent image hosting)
    location /cdn/ {
        alias /app/cdn/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Share links
    location /p/ {
        proxy_pass http://share-service:3000;
        proxy_set_header Host $host;
    }
}
